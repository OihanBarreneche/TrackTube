<!doctype html>
<meta charset="utf-8">
<title>TrackTube : contrôle des cartes Shorts</title>
<p id="summary">Exécution…</p>
<ul id="results"></ul>
<ytd-browse><ytd-rich-grid-renderer></ytd-rich-grid-renderer></ytd-browse>
<script type="module">
  import { run } from './shorts-view.js';
  try {
    const results = await run();
    for (const r of results) {
      const li = document.createElement('li');
      li.className = r.pass ? 'pass' : 'fail';
      li.textContent = r.name + (r.extra ? ' : ' + JSON.stringify(r.extra) : '');
      document.querySelector('#results').append(li);
    }
    const failed = results.filter((r) => !r.pass).length;
    document.querySelector('#summary').textContent = `${results.length} tests de grille, ${failed} échecs`;
    document.querySelector('#summary').className = failed ? 'red' : 'green';
  } catch (err) {
    document.querySelector('#results').innerHTML = '<li class="fail"></li>';
    document.querySelector('.fail').textContent = err.stack;
    document.querySelector('#summary').textContent = 'Échec';
    document.querySelector('#summary').className = 'red';
  }
</script>
