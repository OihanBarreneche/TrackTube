<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560">
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#100e21"/>
      <stop offset=".55" stop-color="#1a153a"/>
      <stop offset="1" stop-color="#2b205d"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#b59bff"/>
      <stop offset="1" stop-color="#7059f5"/>
    </linearGradient>
    <linearGradient id="history-area" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#9e86ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#9e86ff" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="review-card" x2="1" y2="1">
      <stop stop-color="#28233f"/><stop offset="1" stop-color="#172d34"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-35%" width="160%" height="190%">
      <feDropShadow dx="0" dy="16" stdDeviation="25" flood-color="#05040f" flood-opacity=".45"/>
    </filter>
    <clipPath id="feed-clip"><rect x="550" y="42" width="460" height="436" rx="27"/></clipPath>
    <clipPath id="thumb-1"><rect x="583" y="182" width="112" height="70" rx="12"/></clipPath>
    <clipPath id="thumb-2"><rect x="583" y="285" width="112" height="70" rx="12"/></clipPath>
    <clipPath id="thumb-3"><rect x="583" y="388" width="112" height="70" rx="12"/></clipPath>
  </defs>

  <rect width="1400" height="560" fill="url(#background)"/>
  <circle cx="1200" cy="-110" r="350" fill="#6c54ed" opacity=".13"/>
  <circle cx="489" cy="579" r="315" fill="#9e7cf4" opacity=".09"/>
  <path d="M0 480C220 405 350 476 500 560H0Z" fill="#6951d2" opacity=".07"/>

  <!-- The small tile is the brand mark; the marquee opens up the product. -->
  <rect x="72" y="78" width="102" height="102" rx="25" fill="#10101c"/>
  <circle cx="123" cy="129" r="36" fill="none" stroke="#302a51" stroke-width="12"/>
  <path d="M91 137a36 36 0 1 0 13-36" fill="none" stroke="url(#ring)" stroke-width="12" stroke-linecap="round"/>
  <path d="M115 111v37l31-19z" fill="#f9f8ff"/>
  <text x="194" y="150" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" letter-spacing="-2.5">TrackTube</text>
  <text x="75" y="254" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="700">Your subscriptions,</text>
  <text x="75" y="302" fill="#cbbcff" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="700">on your terms.</text>
  <text x="76" y="362" fill="#bdb5d7" font-family="Arial, Helvetica, sans-serif" font-size="21">A chronological feed for the channels</text>
  <text x="76" y="390" fill="#bdb5d7" font-family="Arial, Helvetica, sans-serif" font-size="21">you chose to follow.</text>
  <rect x="75" y="447" width="245" height="43" rx="21" fill="#493987" opacity=".75"/>
  <text x="197.5" y="474" text-anchor="middle" fill="#e6dcff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing=".5">NO RECOMMENDATIONS</text>

  <!-- An illustrative feed, drawn with the same dark cards and purple accents. -->
  <g transform="translate(0 20)">
  <g filter="url(#shadow)"><rect x="550" y="42" width="460" height="436" rx="27" fill="#11101f" stroke="#514379" stroke-width="2"/></g>
  <g clip-path="url(#feed-clip)">
    <rect x="550" y="42" width="460" height="76" fill="#17142b"/>
    <text x="780" y="90" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Subscriptions feed</text>
    <rect x="583" y="132" width="50" height="30" rx="15" fill="#9d82fa"/>
    <text x="608" y="152" text-anchor="middle" fill="#141021" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">All</text>
    <rect x="643" y="132" width="91" height="30" rx="15" fill="#25213c"/>
    <text x="688.5" y="152" text-anchor="middle" fill="#c6bee5" font-family="Arial, Helvetica, sans-serif" font-size="15">Priority</text>
    <rect x="744" y="132" width="113" height="30" rx="15" fill="#25213c"/>
    <text x="800.5" y="152" text-anchor="middle" fill="#c6bee5" font-family="Arial, Helvetica, sans-serif" font-size="15">In progress</text>
    <rect x="867" y="132" width="80" height="30" rx="15" fill="#25213c"/>
    <text x="907" y="152" text-anchor="middle" fill="#c6bee5" font-family="Arial, Helvetica, sans-serif" font-size="15">Hidden</text>

    <image href="thumbnails/lake.jpg" x="583" y="182" width="112" height="70" preserveAspectRatio="xMidYMid slice" clip-path="url(#thumb-1)"/>
    <circle cx="680" cy="197" r="11" fill="#11101f" fill-opacity=".82"/>
    <path d="M675 192l10 10m0-10l-10 10" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="711" y="212" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Videos to watch</text>
    <text x="711" y="236" fill="#a9a1c2" font-family="Arial, Helvetica, sans-serif" font-size="14">From your subscriptions</text>

    <path d="M583 269h394" stroke="#302a48"/>
    <image href="thumbnails/road.jpg" x="583" y="285" width="112" height="70" preserveAspectRatio="xMidYMid slice" clip-path="url(#thumb-2)"/>
    <rect x="584.5" y="286.5" width="109" height="67" rx="10.5" fill="none" stroke="#ffc04d" stroke-width="3"/>
    <circle cx="599" cy="300" r="11" fill="#11101f" fill-opacity=".82"/>
    <path d="M599 292l2.4 5 5.5.7-4 3.9 1 5.5-4.9-2.6-4.9 2.6 1-5.5-4-3.9 5.5-.7z" fill="#ffc04d"/>
    <circle cx="680" cy="300" r="11" fill="#11101f" fill-opacity=".82"/>
    <path d="M675 295l10 10m0-10l-10 10" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="711" y="315" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Mark as priority</text>
    <text x="711" y="339" fill="#a9a1c2" font-family="Arial, Helvetica, sans-serif" font-size="14">Keep your picks close</text>

    <path d="M583 372h394" stroke="#302a48"/>
    <image href="thumbnails/city.jpg" x="583" y="388" width="112" height="70" preserveAspectRatio="xMidYMid slice" clip-path="url(#thumb-3)"/>
    <g clip-path="url(#thumb-3)">
      <rect x="583" y="455" width="112" height="3" fill="#ffffff" fill-opacity=".45"/>
      <rect x="583" y="455" width="43" height="3" fill="#a68cff"/>
    </g>
    <circle cx="680" cy="403" r="11" fill="#11101f" fill-opacity=".82"/>
    <path d="M675 398l10 10m0-10l-10 10" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="711" y="418" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Keep watching</text>
    <text x="711" y="442" fill="#a9a1c2" font-family="Arial, Helvetica, sans-serif" font-size="14">Pick up where you left off</text>
  </g>
  </g>

  <!-- Three compact companion cards: filtering, analysis, channel review. -->
  <g filter="url(#shadow)"><rect x="1078" y="63" width="230" height="112" rx="22" fill="#1d1935" stroke="#655493" stroke-width="2"/></g>
  <g transform="translate(21 0)">
    <rect x="1105" y="97" width="43" height="39" rx="9" fill="none" stroke="#a98df9" stroke-width="4"/>
    <path d="M1119 105l18 12-18 12z" fill="#ad93ff"/><path d="M1102 141l49-49" stroke="#e8d9ff" stroke-width="5" stroke-linecap="round"/>
    <text x="1169" y="112" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Shorts</text>
    <text x="1169" y="139" fill="#cab8ff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">filtered</text>
  </g>

  <g filter="url(#shadow)"><rect x="1034" y="198" width="318" height="158" rx="22" fill="#1d1935" stroke="#655493" stroke-width="2"/></g>
  <text x="1193" y="235" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Watch history</text>
  <path d="M1069 329v-22m16 22v-37m16 37v-26m16 26v-49m16 49v-31m16 31v-57m16 57v-43" stroke="#977bf3" stroke-width="10" stroke-linecap="round"/>
  <path d="M1204 331h117" stroke="#5c507a" stroke-width="2"/>
  <path d="M1204 331v-23l17-11 17 13 17-23 17 12 17-30 17 9 15-21v74z" fill="url(#history-area)"/>
  <path d="M1204 308l17-11 17 13 17-23 17 12 17-30 17 9 15-21" fill="none" stroke="#b69dff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)"><rect x="1034" y="377" width="318" height="141" rx="22" fill="#1d1935" stroke="#655493" stroke-width="2"/></g>
  <text x="1193" y="413" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Sort your subscriptions</text>
  <g transform="translate(0 7)">
  <g transform="rotate(3 1194 459)">
    <rect x="1098" y="430" width="194" height="58" rx="12" fill="url(#review-card)" stroke="#746894" stroke-width="1.5"/>
    <circle cx="1125" cy="457" r="17" fill="#9d82fa"/>
    <path d="M1115 462a11 11 0 0 1 20 0" fill="#e8dfff"/><circle cx="1125" cy="451" r="5" fill="#e8dfff"/>
    <rect x="1155" y="445" width="78" height="7" rx="3.5" fill="#ddd7ed"/>
    <rect x="1155" y="460" width="52" height="5" rx="2.5" fill="#9489aa"/>
    <rect x="1241" y="443" width="14" height="28" rx="4" fill="#7067a5"/>
    <rect x="1259" y="447" width="14" height="24" rx="4" fill="#7aaf9e"/>
  </g>
  <circle cx="1068" cy="454" r="15" fill="#3b2635" stroke="#ff7d8e" stroke-width="1.5"/>
  <path d="M1062 448l12 12m0-12l-12 12" fill="none" stroke="#ff7d8e" stroke-width="3" stroke-linecap="round"/>
  <circle cx="1318" cy="463" r="15" fill="#233a39" stroke="#8cddb9" stroke-width="1.5"/>
  <path d="M1310 463l5 5 11-12" fill="none" stroke="#8cddb9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
