<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560">
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#100e21"/>
      <stop offset=".55" stop-color="#1a153a"/>
      <stop offset="1" stop-color="#2b205d"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#b59bff"/>
      <stop offset="1" stop-color="#7059f5"/>
    </linearGradient>
    <linearGradient id="thumb-a" x2="1" y2="1">
      <stop stop-color="#384e82"/><stop offset="1" stop-color="#8b6fd8"/>
    </linearGradient>
    <linearGradient id="thumb-b" x2="1" y2="1">
      <stop stop-color="#5c3373"/><stop offset="1" stop-color="#db7890"/>
    </linearGradient>
    <linearGradient id="thumb-c" x2="1" y2="1">
      <stop stop-color="#205a65"/><stop offset="1" stop-color="#66a997"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-35%" width="160%" height="190%">
      <feDropShadow dx="0" dy="16" stdDeviation="25" flood-color="#05040f" flood-opacity=".45"/>
    </filter>
    <clipPath id="feed-clip"><rect x="550" y="42" width="508" height="476" rx="27"/></clipPath>
  </defs>

  <rect width="1400" height="560" fill="url(#background)"/>
  <circle cx="1200" cy="-110" r="350" fill="#6c54ed" opacity=".13"/>
  <circle cx="489" cy="579" r="315" fill="#9e7cf4" opacity=".09"/>
  <path d="M0 480C220 405 350 476 500 560H0Z" fill="#6951d2" opacity=".07"/>

  <!-- The small tile is the brand mark; the marquee opens up the product. -->
  <rect x="72" y="78" width="102" height="102" rx="25" fill="#10101c"/>
  <circle cx="123" cy="129" r="36" fill="none" stroke="#302a51" stroke-width="12"/>
  <path d="M91 137a36 36 0 1 0 13-36" fill="none" stroke="url(#ring)" stroke-width="12" stroke-linecap="round"/>
  <path d="M115 111v37l31-19z" fill="#f9f8ff"/>
  <text x="194" y="150" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" letter-spacing="-2.5">TrackTube</text>
  <text x="75" y="254" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="700">Your subscriptions,</text>
  <text x="75" y="302" fill="#cbbcff" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="700">on your terms.</text>
  <text x="76" y="362" fill="#bdb5d7" font-family="Arial, Helvetica, sans-serif" font-size="21">A chronological feed for the channels</text>
  <text x="76" y="390" fill="#bdb5d7" font-family="Arial, Helvetica, sans-serif" font-size="21">you chose to follow.</text>
  <rect x="75" y="447" width="212" height="43" rx="21" fill="#493987" opacity=".75"/>
  <text x="95" y="474" fill="#e6dcff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing=".5">NO RECOMMENDATIONS</text>

  <!-- An illustrative feed, drawn with the same dark cards and purple accents. -->
  <g filter="url(#shadow)"><rect x="550" y="42" width="508" height="476" rx="27" fill="#11101f" stroke="#514379" stroke-width="2"/></g>
  <g clip-path="url(#feed-clip)">
    <rect x="550" y="42" width="508" height="76" fill="#17142b"/>
    <text x="583" y="90" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Subscriptions</text>
    <circle cx="1015" cy="80" r="17" fill="#272140"/><path d="M1015 70v11l8 5" fill="none" stroke="#aa98fb" stroke-width="3" stroke-linecap="round"/>
    <rect x="583" y="132" width="50" height="30" rx="15" fill="#9d82fa"/>
    <text x="600" y="152" fill="#141021" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">All</text>
    <rect x="643" y="132" width="91" height="30" rx="15" fill="#25213c"/>
    <text x="661" y="152" fill="#c6bee5" font-family="Arial, Helvetica, sans-serif" font-size="15">Priority</text>
    <rect x="744" y="132" width="113" height="30" rx="15" fill="#25213c"/>
    <text x="759" y="152" fill="#c6bee5" font-family="Arial, Helvetica, sans-serif" font-size="15">In progress</text>

    <rect x="583" y="182" width="112" height="70" rx="12" fill="url(#thumb-a)"/>
    <circle cx="661" cy="207" r="22" fill="#c2afff" opacity=".45"/>
    <path d="M583 235l40-35 21 19 26-15 25 31" fill="#211a53" opacity=".7"/>
    <text x="711" y="217" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Latest uploads</text>
    <text x="711" y="241" fill="#a9a1c2" font-family="Arial, Helvetica, sans-serif" font-size="14">Published today</text>
    <path d="M994 191l5 10 11 2-8 8 2 11-10-5-10 5 2-11-8-8 11-2z" fill="#b89aff"/>

    <path d="M583 269h442" stroke="#302a48"/>
    <rect x="583" y="285" width="112" height="70" rx="12" fill="url(#thumb-b)"/>
    <circle cx="616" cy="318" r="21" fill="#fec6a8" opacity=".65"/>
    <path d="M583 340l39-16 29 12 44-31v50H583Z" fill="#4a265e" opacity=".65"/>
    <text x="711" y="322" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Keep watching</text>
    <rect x="711" y="345" width="234" height="4" rx="2" fill="#403956"/>
    <rect x="711" y="345" width="89" height="4" rx="2" fill="#a68cff"/>

    <path d="M583 372h442" stroke="#302a48"/>
    <rect x="583" y="388" width="112" height="70" rx="12" fill="url(#thumb-c)"/>
    <circle cx="644" cy="417" r="28" fill="#abe6bd" opacity=".45"/>
    <path d="M583 449l35-21 23 8 54-23v45H583Z" fill="#174049" opacity=".7"/>
    <text x="711" y="411" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Videos to watch</text>
    <text x="711" y="437" fill="#a9a1c2" font-family="Arial, Helvetica, sans-serif" font-size="13">From your subscriptions</text>
    <circle cx="997" cy="416" r="15" fill="#403465"/>
    <path d="M997 407v18m-9-9h18" stroke="#d7c9ff" stroke-width="3" stroke-linecap="round"/>
    <path d="M583 480h442" stroke="#302a48"/>
    <circle cx="598" cy="499" r="9" fill="#9b79ef"/><circle cx="613" cy="499" r="9" fill="#80b2d5"/><circle cx="628" cy="499" r="9" fill="#e0a485"/>
    <text x="647" y="505" fill="#c8bee8" font-family="Arial, Helvetica, sans-serif" font-size="15">Sort your subscriptions</text>
  </g>

  <!-- The floating controls make the other capabilities readable at a glance. -->
  <g filter="url(#shadow)"><rect x="1082" y="64" width="270" height="112" rx="22" fill="#1d1935" stroke="#655493" stroke-width="2"/></g>
  <rect x="1105" y="89" width="38" height="60" rx="10" fill="none" stroke="#a98df9" stroke-width="4"/>
  <path d="M1117 102l16 16-16 16z" fill="#ad93ff"/><path d="M1100 151l46-64" stroke="#e8d9ff" stroke-width="5" stroke-linecap="round"/>
  <text x="1162" y="111" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Shorts</text>
  <text x="1162" y="139" fill="#cab8ff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">filtered</text>

  <g filter="url(#shadow)"><rect x="1082" y="197" width="270" height="112" rx="22" fill="#1d1935" stroke="#655493" stroke-width="2"/></g>
  <path d="M1130 220l7 14 16 2-12 12 3 16-14-8-14 8 3-16-12-12 16-2z" fill="#c4a9ff"/>
  <text x="1162" y="244" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Save for later</text>
  <text x="1162" y="271" fill="#a9a1c2" font-family="Arial, Helvetica, sans-serif" font-size="15">Priority videos stay close</text>

  <g filter="url(#shadow)"><rect x="1082" y="330" width="270" height="179" rx="22" fill="#1d1935" stroke="#655493" stroke-width="2"/></g>
  <text x="1108" y="368" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Watch history</text>
  <text x="1108" y="392" fill="#a9a1c2" font-family="Arial, Helvetica, sans-serif" font-size="15">See your viewing patterns</text>
  <path d="M1108 468h218" stroke="#4c436e" stroke-width="2"/>
  <path d="M1113 458v-21m24 21v-39m24 39v-27m24 27v-50m24 50v-36m24 36v-57m24 57v-42m24 42v-61m24 61v-47" stroke="#7562c5" stroke-width="13" stroke-linecap="round"/>
  <path d="M1108 434l25-12 26 9 25-31 25 20 24-30 25 16 25-27 24 15" fill="none" stroke="#d0b5ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
